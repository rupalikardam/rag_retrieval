[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-router"
version = "0.1.0"
description = "Retrieve / don't-retrieve / abstain routing for RAG systems"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scikit-learn", "pyyaml", "joblib"]

[project.optional-dependencies]
hf = ["torch", "transformers", "datasets", "sentencepiece", "accelerate"]
dense = ["sentence-transformers"]
plot = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
